[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/guardrails.py" = ["E501"]
"eval/generate_report.py" = ["E501"]
"tests/test_oss_model.py" = ["E501"]
